name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  # Computes the next version WITHOUT creating anything: dry_run is hardcoded
  # true here. A tag is a permanent, public marker, so it is only written once
  # the artifacts it names are known to build -- see the `tag` job below.
  versioning:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
      new_version: ${{ steps.vars.outputs.new_version }}
      changelog: ${{ steps.bump.outputs.changelog }}
      image: ghcr.io/wenisch-tech/cert-manager-webhook-allinkl
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version and changelog
        id: bump
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ github.token }}
          release_branches: main
          default_bump: patch
          dry_run: true

      - name: Compute version variables
        id: vars
        run: |
          if [ -n "${{ steps.bump.outputs.new_tag }}" ]; then
            echo "new_version=${{ steps.bump.outputs.new_tag }}" | sed 's/^new_version=v/new_version=/' >> "$GITHUB_OUTPUT"
          else
            echo "new_version=0.0.1" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: versioning
    uses: ./.github/workflows/_test.yml
    with:
      version: ${{ needs.versioning.outputs.new_version }}

  build:
    needs: versioning
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ needs.versioning.outputs.new_version }}

  # Gated behind `tag` so the image is built from an already-tagged commit.
  # The explicit result checks exist because `tag` is main-only: without them
  # a skipped `tag` would cascade and skip the image build on every branch and
  # Renovate PR, which is where a broken Dockerfile would otherwise hide.
  docker:
    needs:
      - versioning
      - test
      - build
      - tag
    if: >-
      ${{ !cancelled()
          && github.event_name == 'push'
          && needs.test.result == 'success'
          && needs.build.result == 'success'
          && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_docker.yml
    with:
      version: ${{ needs.versioning.outputs.new_version }}
      image: ${{ needs.versioning.outputs.image }}

  # Created once tests and binaries pass, before the image is built, so the
  # image is produced from a commit that already carries its tag. The version
  # is recomputed rather than passed in: the action is the single source of
  # truth for it, and no commits can have landed in between on this ref.
  tag:
    needs:
      - versioning
      - test
      - build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create tag
        id: bump
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ github.token }}
          release_branches: main
          default_bump: patch
          dry_run: false

  release:
    needs:
      - versioning
      - test
      - build
      - tag
      - docker
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    uses: ./.github/workflows/_release.yml
    with:
      version: ${{ needs.versioning.outputs.new_version }}
      tag: ${{ needs.tag.outputs.new_tag }}
      changelog: ${{ needs.versioning.outputs.changelog }}
      image: ${{ needs.versioning.outputs.image }}
    secrets: inherit
